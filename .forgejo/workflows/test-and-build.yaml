on:
  push:
    branches:
      - master

jobs:
  test:
    runs-on: docker
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Setup go
        uses: actions/setup-go@v4
        with:
          go-version: "1.27.4"
      - name: Test
        run: go test -v ./...
